# Documentation PROJET (non publiée) — aperçu : `mise run docs:serve`
site_name: Vitrine — documentation projet
docs_dir: docs
site_dir: build-docs

theme:
  name: material
  language: fr
  features:
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Accueil: README.md
  - Architecture: architecture.md
  - Explications:
      - Design system: explanation/design-system.md
  - Skills:
      - Navigation: skills/site-navigation/SKILL.md
      - Look & feel: skills/site-look-and-feel/SKILL.md
