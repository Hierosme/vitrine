# Documentation PROJET (non publiée) — aperçu : `mise run docs:serve`

[project]
site_name = "Vitrine — documentation projet"
docs_dir = "docs"
site_dir = "build-docs"

nav = [
  { "Accueil" = "README.md" },
  { "Architecture" = "architecture.md" },
  { "Explications" = [
    { "Design system" = "explanation/design-system.md" },
  ] },
  { "Skills" = [
    { "Norme de design (Oxygen UI × Nord)" = "skills/oxygen-ui-design-guidelines/SKILL.md" },
    { "Navigation" = "skills/site-navigation/SKILL.md" },
    { "Look & feel" = "skills/site-look-and-feel/SKILL.md" },
    { "Rédaction d'article" = "skills/redaction-article-reference-it/SKILL.md" },
  ] },
]

[project.theme]
variant = "classic"
language = "fr"
features = [
  "navigation.indexes",
  "content.code.copy",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
pymdownx.details = {}
tables = {}
toc.permalink = true
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true
