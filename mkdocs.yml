# Navigation : voir docs/skills/site-navigation/SKILL.md
# Look & feel : voir docs/skills/site-look-and-feel/SKILL.md
site_name: Jérôme Ornech
site_description: Expert DevOps freelance — automatisation systèmes et réseaux (Ansible, Python), Network as Code, Continuous Delivery
site_author: Jérôme Ornech
site_url: https://mondomaine.fr/   # TODO: remplacer par le domaine réel

docs_dir: site      # sources du site
site_dir: build     # sortie du build (≠ "site", déjà pris par les sources)

copyright: "&copy; Jérôme Ornech — Expert DevOps freelance"

theme:
  name: material
  custom_dir: overrides   # SEO : balises Open Graph, JSON-LD, apple-touch-icon (overrides/main.html)
  language: fr
  favicon: assets/images/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/infinity
  # Thèmes Nord clair (default) / sombre (slate) : couleurs définies dans site/stylesheets/extra.css
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    # navigation.footer désactivé : liens Précédent/Suivant hors sujet sur une vitrine (et fuite des pages d'archives du blog)
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  # Données structurées (JSON-LD Person, overrides/main.html) — uniquement des faits présents sur le site
  seo:
    job_title: Expert DevOps freelance
    image: assets/images/jerome-ornech.jpg
    locality: Propriano
    region: Corse
    country: FR
    languages: [fr, en]
    knows_about:
      - Ansible
      - Python
      - Network as Code
      - Continuous Delivery
      - CI/CD
      - Calcul haute performance (HPC)
      - Conformité ANSSI
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/j%C3%A9r%C3%B4me-ornech-5a6281356
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/Hierosme
      name: GitHub
    - icon: material/email
      link: mailto:contact@mondomaine.fr
      name: Email

hooks:
  - hooks/robots.py   # génère build/robots.txt (avec l'URL du sitemap tirée de site_url)

plugins:
  - search:
      lang: fr
  # Polices Google auto-hébergées au build (RGPD : aucune requête vers Google depuis le navigateur du visiteur).
  # Le 1er build télécharge les polices dans .cache/ (réseau requis). Hors ligne : VITRINE_PRIVACY=false.
  - privacy:
      enabled: !ENV [VITRINE_PRIVACY, true]
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      post_url_format: "{slug}"   # URL courtes et pérennes : /blog/<slug>/
      post_readtime: true
      archive_name: Archives
      categories_name: Catégories
      categories_allowed:
        - Ansible
        - Network as Code
        - CI/CD
        - Python
        - Sécurité
        - Culture DevOps
        - Freelance

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Source de vérité unique de la navigation principale (max 6 onglets)
nav:
  - Accueil: index.md
  - Services: services.md
  - Parcours: parcours.md
  - Blog:
      - blog/index.md
  - Contact: contact.md
